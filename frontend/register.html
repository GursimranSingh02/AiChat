<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/frontend/assets/app.css" />
  </head>
  <body class="page-fade text-slate-100">
    <main class="min-h-screen relative overflow-hidden">
      <div class="absolute inset-0 soft-grid opacity-35"></div>
      <div class="absolute -top-32 -left-24 h-80 w-80 rounded-full bg-sky-500/20 blur-3xl"></div>
      <div class="absolute -bottom-28 -right-12 h-96 w-96 rounded-full bg-cyan-400/15 blur-3xl"></div>

      <section class="relative mx-auto flex min-h-screen max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8">
        <div class="grid w-full gap-8 lg:grid-cols-[1.05fr_0.95fr]">
          <div class="flex flex-col justify-between rounded-3xl border border-white/10 bg-white/5 p-8 lg:p-10">
            <div>
              <div class="inline-flex items-center gap-2 rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.28em] text-sky-200">
                AiChat
              </div>
              <h1 class="mt-6 max-w-xl text-4xl font-semibold tracking-tight text-white sm:text-5xl">
                Create your account and start using the chat workspace.
              </h1>
              <p class="mt-4 max-w-lg text-base leading-7 text-slate-300">
                Create an account in a clean, simple flow and start chatting right away.
              </p>
            </div>
          </div>

          <div class="glass-panel rounded-3xl p-6 sm:p-8 lg:p-10">
            <div class="mb-8">
              <h2 class="text-2xl font-semibold text-white">Register</h2>
              <p class="mt-2 text-sm leading-6 text-slate-300">Use your name, email, and a password to create an account.</p>
            </div>

            <div data-status class="status-message mb-6 text-sm text-slate-300"></div>

            <form
              id="register-form"
              class="space-y-4"
              data-auth-form
              data-mode="register"
              data-endpoint="/api/v1/auth/register"
              data-redirect="/login?registered=1"
            >
              <div class="input-shell rounded-2xl border border-white/10 bg-slate-950/55 px-4 py-3">
                <label for="name" class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Name</label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  required
                  class="w-full bg-transparent text-white outline-none placeholder:text-slate-500"
                  placeholder="Your full name"
                />
              </div>

              <div class="input-shell rounded-2xl border border-white/10 bg-slate-950/55 px-4 py-3">
                <label for="email" class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                  class="w-full bg-transparent text-white outline-none placeholder:text-slate-500"
                  placeholder="you@example.com"
                />
              </div>

              <div class="input-shell rounded-2xl border border-white/10 bg-slate-950/55 px-4 py-3">
                <label for="password" class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Password</label>
                <div class="relative">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                    class="w-full bg-transparent pr-12 text-white outline-none placeholder:text-slate-500"
                    placeholder="Create a strong password"
                  />
                  <button
                    type="button"
                    class="absolute right-0 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                    data-toggle-password
                    aria-label="Show password"
                    aria-pressed="false"
                  >
                    <svg data-icon="show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5S21.75 12 21.75 12 18 19.5 12 19.5 2.25 12 2.25 12Z" />
                      <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <svg data-icon="hide" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="hidden h-5 w-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 2.25 12s3.75 7.5 9.75 7.5c1.27 0 2.466-.217 3.569-.607M6.228 6.228C8.003 5.25 9.93 4.5 12 4.5c6 0 9.75 7.5 9.75 7.5a20.36 20.36 0 0 1-4.069 4.957M9.878 9.878A3 3 0 1 0 14.12 14.12" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 4.5 15 15" />
                    </svg>
                  </button>
                </div>
              </div>

              <button
                type="submit"
                class="w-full rounded-2xl bg-sky-500 px-5 py-3.5 text-sm font-semibold text-white transition hover:bg-sky-400 focus:outline-none focus:ring-4 focus:ring-sky-500/30"
              >
                Create account
              </button>
            </form>

            <p class="mt-6 text-sm text-slate-300">
              Already have an account?
              <a class="font-semibold text-sky-300 hover:text-sky-200" href="/login">Log in</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script>
      window.__BACKEND_URL__ = "{{BACKEND_URL}}";
    </script>
    <script>
      (function () {
        const backendUrl = String(window.__BACKEND_URL__ || "").replace(/\/$/, "");
        const form = document.getElementById("register-form");
        const status = document.querySelector("[data-status]");
        const submitButton = form.querySelector("button[type='submit']");
        const passwordInput = document.getElementById("password");
        const toggleButton = document.querySelector("[data-toggle-password]");
        const showIcon = toggleButton.querySelector("[data-icon='show']");
        const hideIcon = toggleButton.querySelector("[data-icon='hide']");

        function setStatus(message, tone) {
          status.textContent = message;
          status.className = "status-message mb-6 text-sm font-medium";
          status.classList.add(
            tone === "success"
              ? "text-emerald-300"
              : tone === "error"
                ? "text-rose-300"
                : "text-slate-300"
          );
        }

        toggleButton.addEventListener("click", () => {
          const isHidden = passwordInput.type === "password";
          passwordInput.type = isHidden ? "text" : "password";
          showIcon.classList.toggle("hidden", !isHidden);
          hideIcon.classList.toggle("hidden", isHidden);
          toggleButton.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
          toggleButton.setAttribute("aria-pressed", String(isHidden));
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const payload = Object.fromEntries(new FormData(form).entries());
          const originalText = submitButton.textContent;

          try {
            submitButton.disabled = true;
            submitButton.textContent = "Please wait...";
            setStatus("Submitting request...", "info");

            const response = await fetch(`${backendUrl}/api/v1/auth/register`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data?.message || "Registration failed");
            }

            setStatus(data.message || "Registration complete.", "success");
            window.setTimeout(() => {
              window.location.href = "/login?registered=1";
            }, 900);
          } catch (error) {
            setStatus(error.message || "Something went wrong.", "error");
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = originalText || "Create account";
          }
        });
      })();
    </script>
  </body>
</html>
